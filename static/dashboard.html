<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 20px; }
        #upload-status { margin-top: 10px; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <a href="/" style="color: #888; font-size: 12px; text-decoration: none;">← Back to Chat</a>
    <h1>Document Dashboard</h1>

    <input type="file" id="file-input" accept="application/pdf" />
    <button id="upload-btn">Upload</button>
    <p id="upload-status"></p>

    <table>
        <thead>
            <tr><th>Document Name</th><th>Chunks</th></tr>
        </thead>
        <tbody id="doc-list"></tbody>
    </table>

    <script>
        async function loadDocuments() {
            const res = await fetch("/api/documents");
            const data = await res.json();
            const tbody = document.getElementById("doc-list");
            tbody.innerHTML = "";
            data.documents.forEach(doc => {
                tbody.innerHTML += `<tr><td>${doc.document_name}</td><td>${doc.chunk_count}</td></tr>`;
            });
        }

        document.getElementById("upload-btn").addEventListener("click", async () => {
            const fileInput = document.getElementById("file-input");
            const status = document.getElementById("upload-status");

            if (!fileInput.files.length) {
                status.innerText = "Please select a file first.";
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            status.innerText = "Uploading and ingesting... this may take a few minutes for large documents.";

            const res = await fetch("/api/documents", {
                method: "POST",
                body: formData
            });
            const data = await res.json();

            status.innerText = `Done: ${data.document_name} — ${data.chunks_added} chunks added.`;
            loadDocuments();
        });

        loadDocuments();
    </script>
</body>

</html>
