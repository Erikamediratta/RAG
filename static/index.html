        darkMode: "class",
        theme: {
          extend: {
            "colors": {

                    "on-secondary-container": "#b6b4b8",
                    "tertiary-fixed": "#e3e1ea",
                    "on-surface-variant": "#d1c6ab",
                    "surface-container-high": "#2a2a2c",
                    "primary-fixed-dim": "#eec200",
                    "outline-variant": "#4d4632",
                    "secondary-container": "#47464a",
                    "on-primary-container": "#6c5700",
                    "primary": "#ffecb9",
                    "background": "#131315",
                    "inverse-primary": "#735c00",
                    "error-container": "#93000a",
                    "primary-fixed": "#ffe083",
                    "surface-variant": "#353437",
                    "surface-dim": "#131315",
                    "on-background": "#e5e1e4",
                    "primary-container": "#facc15",
                    "tertiary": "#eeecf5",
                    "inverse-on-surface": "#313032",
                    "on-tertiary-container": "#595960",
                    "secondary": "#c8c6c9",
                    "surface-container-low": "#1c1b1d",
                    "outline": "#9a9078",
                    "inverse-surface": "#e5e1e4",
                    "on-surface": "#e5e1e4",
                    "secondary-fixed-dim": "#c8c6c9",
                    "on-secondary": "#303033",
                    "surface-tint": "#eec200",
                    "tertiary-container": "#d2d0d9",
                    "on-primary": "#3c2f00",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#1b1b21",
                    "on-primary-fixed-variant": "#574500",
                    "tertiary-fixed-dim": "#c7c5ce",
                    "on-tertiary": "#303037",
                    "on-secondary-fixed-variant": "#47464a",
                    "on-tertiary-fixed-variant": "#46464d",
                    "surface-bright": "#39393b",
                    "surface": "#131315",
                    "secondary-fixed": "#e4e1e5",
                    "on-primary-fixed": "#231b00",
                    "on-error-container": "#ffdad6",
                    "surface-container": "#201f22",
                    "on-secondary-fixed": "#1b1b1e",
                    "error": "#ffb4ab",
                    "surface-container-highest": "#353437"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter": "12px",
                    "unit": "4px",
                    "container-padding": "12px",
                    "margin": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-sm": ["JetBrains Mono"],
                    "body-md": ["Hanken Grotesk"],
                    "code-block": ["JetBrains Mono"],
                    "headline-lg": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "code-block": ["13px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    }catch(_e){}</script></head><body class="bg-background text-on-background font-body-md min-h-screen flex flex-col" style="background-color: rgb(0, 0, 0);">

    <!-- TopAppBar -->
    <header class="bg-background text-primary w-full border-b border-outline-variant flex justify-between items-center px-margin py-2 sticky top-0 z-50" style="background-color: rgb(0, 0, 0);">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">terminal</span>
        <h1 class="font-headline-md text-headline-md-mobile tracking-tighter">AI DEV CONSOLE</h1>
    </div>
    <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="font-label-sm text-outline hover:text-primary transition-colors text-[10px] uppercase">Documents</a>
        <span class="w-2 h-2 bg-primary-container"></span>
        <span class="font-label-sm text-primary uppercase text-[10px]">API ONLINE</span>
    </div>
    </header>

    <!-- Chat Canvas -->
    <main id="chat-canvas" class="flex-grow flex flex-col p-margin pb-32 space-y-6 overflow-y-auto"></main>

    <!-- Bottom Input Bar -->
    <div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-margin z-50" style="background-color: rgb(0, 0, 0);">
        <div class="relative flex items-center gap-2">
            <div class="relative flex-grow">
                <input type="text" id="chat-input" placeholder="Type a dev command..." class="w-full bg-background border border-outline-variant px-4 py-3 font-label-sm text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/50 placeholder:uppercase" style="background-color: rgb(0, 0, 0);">
                <div class="absolute right-3 top-1/2 -translate-y-1/2 flex gap-2">
                    <span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary transition-colors text-[20px]">attach_file</span>
                </div>
            </div>
            <button id="send-btn" class="bg-primary-container text-on-primary-container h-[46px] w-[46px] flex items-center justify-center active:scale-95 transition-transform">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
            </button>
        </div>

        <!-- Status Bar -->
        <div class="mt-2 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5">
                    <div class="w-1.5 h-1.5 bg-primary-container"></div>
                    <span class="text-[9px] font-label-sm text-outline uppercase">Node 20.x</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-1.5 h-1.5 bg-outline"></div>
                    <span class="text-[9px] font-label-sm text-outline uppercase">Manifest V3</span>
                </div>
            </div>
            <span class="text-[9px] font-label-sm text-outline/50 uppercase">v2.4.1-stable</span>
        </div>
    </div>

    <nav class="hidden"></nav>

    <script>
    function getUserId() {
    let userId = localStorage.getItem("user_id");
    if (!userId) {
        userId = "user-" + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("user_id", userId);
    }
    return userId;
}
const userId = getUserId();
    const urlParams = new URLSearchParams(window.location.search);
    const selectedDoc = urlParams.get("doc");
    const chatCanvas = document.getElementById("chat-canvas");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    let chatHistory=[]

    function addUserMessage(text) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        chatCanvas.insertAdjacentHTML("beforeend", `
            <div class="flex flex-col items-end space-y-1">
                <div class="bg-surface-container-high border border-outline-variant p-3 max-w-[85%]">
                    <p class="font-body-md">${text}</p>
                </div>
                <span class="font-label-sm text-[10px] text-outline px-1">${time}</span>
            </div>
        `);
        chatCanvas.scrollTop = chatCanvas.scrollHeight;
    }

    function addThinking() {
        chatCanvas.insertAdjacentHTML("beforeend", `
            <div id="thinking-indicator" class="flex items-center gap-4 py-2 opacity-80">
                <div class="w-8 h-8 flex items-center justify-center bg-surface-container-low border border-outline-variant">
                    <span class="material-symbols-outlined text-primary text-[18px]">memory</span>
                </div>
                <div class="flex gap-1">
                    <span class="w-1.5 h-1.5 bg-primary-container thinking-dot"></span>
                    <span class="w-1.5 h-1.5 bg-primary-container thinking-dot"></span>
                    <span class="w-1.5 h-1.5 bg-primary-container thinking-dot"></span>
                </div>
            </div>
        `);
        chatCanvas.scrollTop = chatCanvas.scrollHeight;
    }

    function removeThinking() {
        const el = document.getElementById("thinking-indicator");
        if (el) el.remove();
    }

    function addAIMessage(text) {
        chatCanvas.insertAdjacentHTML("beforeend", `
            <div class="flex flex-col items-start space-y-2">
                <div class="flex items-center gap-2">
                    <div class="bg-primary-container text-on-primary-container px-2 py-0.5 font-label-sm text-[10px] uppercase">AI</div>
                </div>
                <div class="bg-surface-container-lowest border border-outline-variant p-4 w-full space-y-3">
                    <p class="font-body-md whitespace-pre-wrap">${text}</p>
                </div>
            </div>
        `);
        chatCanvas.scrollTop = chatCanvas.scrollHeight;
    }

    async function sendMessage() {
        const question = chatInput.value.trim();
        if (!question) return;

        addUserMessage(question);
        chatInput.value = "";
        addThinking();

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: question,chat_history:chatHistory,document_filter:selectedDoc,user_id:userId })
            });
            const data = await res.json();
            removeThinking();
            addAIMessage(data.response);

            chatHistory.push({role:"user",content:question})
            chatHistory.push({role:"assistant",content:data.response})
        } catch (err) {
            removeThinking();
            addAIMessage("Error: could not reach the assistant.");
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });
    </script>
</body></html>
